---
on:
  workflow_call:
    inputs:
      bump_type:
        type: string
      prerelease:
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    uses: uclahs-cds/tool-create-release/.github/workflows/wf-prepare-release.yaml@v1.1.0
    with:
      bump_type: ${{ inputs.bump_type }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
