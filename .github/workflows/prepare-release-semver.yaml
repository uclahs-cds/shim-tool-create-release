---
name: 📦 Prepare new release (overridden)

on:
  workflow_call:
    inputs:
      bump_type:
        type: string
      prerelease:
        type: boolean

permissions:
  actions: read
  contents: write
  pull-requests: write

run-name: Open PR for new ${{ inputs.bump_type }} release

jobs:
  prepare-release:
    uses: uclahs-cds/tool-create-release/.github/workflows/wf-prepare-release.yaml@v1.1.0
    with:
      bump_type: ${{ inputs.bump_type }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit
